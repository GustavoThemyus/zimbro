spring.application.name=zimbro

# Banco. Em producao tudo vem de variavel de ambiente; o valor depois dos dois pontos
# e o padrao do docker compose local.
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5433/zimbro}
spring.datasource.username=${DB_USER:zimbro}
spring.datasource.password=${DB_PASSWORD:zimbro}

# O schema e criado SO pelo Flyway. 'validate' faz o app se recusar a subir se as
# entidades e o banco discordarem, em vez de alterar tabela em silencio.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.flyway.enabled=true

# Fuso da aplicacao. Fato de negocio e 'date'; relogio de sistema e 'timestamptz'.
spring.jackson.time-zone=America/Sao_Paulo

management.endpoints.web.exposure.include=health,info
management.endpoint.health.probes.enabled=true

# O starter de mail registra um health indicator que CONECTA no SMTP a cada
# checagem. Com ele ligado, SMTP fora do ar (ou sem credencial, como agora) faz
# /actuator/health devolver 503 DOWN — o container vira 'unhealthy' e o
# UptimeRobot alerta, por causa de uma dependencia que nao impede o produto de
# funcionar. Lancar, fechar o mes e ver relatorio nao dependem de e-mail.
#
# A consequencia aceita: queda do SMTP nao aparece no /health. Ela aparece no log
# e no Sentry, pelo catch do AvisosPorEmail, que e o lugar certo — e o token de
# recuperacao continua valido para o usuario pedir outro link.
management.health.mail.enabled=false
server.shutdown=graceful

# Endereco publico do app. Entra no link de recuperacao de senha, entao em
# producao ele TEM que ser o dominio real — com localhost aqui, o e-mail sai com
# um link que so funciona na maquina do dev.
app.endereco=${APP_ENDERECO:http://localhost:3000}

# Envio de e-mail: 'log' escreve o link no log do servidor (desenvolvimento),
# 'smtp' envia de verdade. O padrao e 'log' de proposito: sem credencial
# configurada o app sobe e funciona, gritando no startup que nao envia nada.
#
# Com modo=smtp e spring.mail.host vazio o app SE RECUSA A SUBIR, em vez de
# voltar calado para o log. Erro de digitacao em producao tem que aparecer no
# deploy, nao seis semanas depois no primeiro cliente que esquece a senha.
zimbro.email.modo=${EMAIL_MODO:log}
zimbro.email.remetente=${EMAIL_REMETENTE:Zimbro <nao-responda@localhost>}

spring.mail.host=${SMTP_HOST:}
spring.mail.port=${SMTP_PORT:587}
spring.mail.username=${SMTP_USUARIO:}
spring.mail.password=${SMTP_SENHA:}
# STARTTLS na 587. Provedor que exige TLS direto na 465 precisa de
# spring.mail.properties.mail.smtp.ssl.enable=true em vez disto.
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
# Sem isto, SMTP fora do ar faz a requisicao de recuperacao pendurar.
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000
